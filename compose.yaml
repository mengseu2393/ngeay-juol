# RentWise production stack.
#
# The native dev setup (php8.3 artisan serve + host MySQL) keeps working and is
# untouched by this file — nothing here binds to the host's MySQL or Redis.
#
#   cp .env.docker.example .env.docker   # then fill in the secrets
#   docker compose build
#   docker compose up -d
#
# The two containers that are easy to forget when deploying by hand — `queue`
# and `scheduler` — are services here, so they cannot be forgotten.

services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # Only this container migrates and warms caches; see docker/entrypoint.sh.
      RENTWISE_ROLE: app
    volumes:
      # Uploads, generated exports and logs must outlive the container. The rest
      # of the app is baked into the image and deliberately not mounted.
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      # Host port only. Put TLS on a reverse proxy in front and set
      # TRUSTED_PROXIES to its address, or the login throttle keys on the
      # proxy's IP instead of the client's.
      - "8080:80"
    depends_on:
      - app

  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      RENTWISE_ROLE: worker
    # --timeout must stay BELOW queue.connections.*.retry_after (90s), or a
    # still-running job is released and runs twice — duplicate invoices.
    command: php artisan queue:work --tries=3 --timeout=60 --sleep=3 --max-time=3600
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      - app

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      RENTWISE_ROLE: worker
    # Replaces the `* * * * * artisan schedule:run` cron entry: rent invoice
    # generation, overdue notices, subscription lifecycle.
    command: php artisan schedule:work
    volumes:
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # MYSQL_* live in .env.docker alongside the DB_* the app reads, so the
    # credentials are defined once.
    env_file: .env.docker
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # app/ waits on this before migrating.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions live here (db 2). Without persistence a restart logs every
    # landlord out.
    command: redis-server --appendonly yes
    volumes:
      - redis:/data

volumes:
  mysql:
  redis:
  storage:
  logs:
