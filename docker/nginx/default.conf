server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Invoice batch PDFs and Excel exports can be large and slow to stream.
    client_max_body_size 24m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files (avatars, ID-card and maintenance photos) live on the `storage` volume,
    # which is not part of this container's image — the `public/storage` symlink Laravel makes
    # at runtime exists only inside the app container. Serve the public disk straight from the
    # (read-only) volume instead; without this every /storage/... URL is a 404.
    # No try_files here: it does not combine with `alias`. A missing file is a plain 404.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # A queued batch render is capped at 300s in the job; give the
        # synchronous (<=10 invoice) path room without hanging forever.
        fastcgi_read_timeout 180;
    }

    # Never serve the dotfiles that carry secrets.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
