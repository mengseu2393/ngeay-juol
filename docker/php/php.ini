; RentWise runtime tuning. The dev host's herd-lite PHP ships without OPcache
; and with pcre.jit=0, which is the documented cause of ~300ms/request locally
; (CLAUDE.md "Known pitfalls"). Both are on here.

memory_limit = 512M
max_execution_time = 120

; Invoice photos / maintenance-request uploads go through medialibrary.
upload_max_filesize = 20M
post_max_size = 24M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; Filament + Laravel together are well over the 10k default.
opcache.max_accelerated_files = 20000
; The image is immutable, so never stat the filesystem for changes.
opcache.validate_timestamps = 0

pcre.jit = 1

; Khmer text is multibyte everywhere; make the default explicit.
default_charset = "UTF-8"
